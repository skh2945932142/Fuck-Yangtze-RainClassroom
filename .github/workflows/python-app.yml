name: Rain classroom auto answer (scheduled)

on:
  schedule:
    - cron: "*/30 23,0-3,6-12 * 1,3-6,9-12 1-5"  # 北京时间周一至周五 07:00-20:00，每 30 分钟（UTC-8）
  workflow_dispatch:  # 允许手动触发

# 等待前面任务执行完成
concurrency:
  group: scheduled-task
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    # start.py 现在是常驻守护进程：限制单次运行 1 小时，到点退出后由下一次 cron 接力
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 允许推送更改

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        run: python -u start.py
        env:
            SESSION: ${{ secrets.SESSION }}
            AI_KEY: ${{ secrets.AI_KEY }}
            AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
            AI_MODEL: ${{ secrets.AI_MODEL }}
            ENNCY_KEY: ${{ secrets.ENNCY_KEY }}
            FILTERED_COURSES: ${{ secrets.FILTERED_COURSES }}
            VISION_MODE: ${{ vars.VISION_MODE }}
            EMAIL_USER: ${{ secrets.EMAIL_USER }}
            EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
            TO_EMAIL: ${{ secrets.TO_EMAIL }}

