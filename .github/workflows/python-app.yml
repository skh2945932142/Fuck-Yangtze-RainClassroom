name: Rain classroom auto answer (scheduled)

on:
  schedule:
    - cron: "*/20 23,0-3,6-12 * 1,3-6,9-12 1-5"  # 北京时间周一至周五 07:00-20:00，每 20 分钟（UTC-8）
  workflow_dispatch:  # 允许手动触发

# 等待前面任务执行完成
concurrency:
  group: scheduled-task
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    # start.py 是常驻守护进程：限制单次运行 50 分钟，到点退出后由下一次 cron 接力。
    # 留 10 分钟余量给 checkout + 依赖安装（paddle 较大）。
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        run: python -u start.py
        env:
            SESSION: ${{ secrets.SESSION }}
            AI_KEY: ${{ secrets.AI_KEY }}
            AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
            AI_MODEL: ${{ secrets.AI_MODEL }}
            ENNCY_KEY: ${{ secrets.ENNCY_KEY }}
            FILTERED_COURSES: ${{ secrets.FILTERED_COURSES }}
            EXCLUDE_COURSES: ${{ secrets.EXCLUDE_COURSES }}
            SUBMIT_BEFORE_DEADLINE_SECONDS: ${{ vars.SUBMIT_BEFORE_DEADLINE_SECONDS }}
            SUBJECTIVE_MAX_CHARS: ${{ vars.SUBJECTIVE_MAX_CHARS }}
            SCAN_INTERVAL_SECONDS: ${{ vars.SCAN_INTERVAL_SECONDS }}
            VISION_MODE: ${{ vars.VISION_MODE }}
            EMAIL_USER: ${{ secrets.EMAIL_USER }}
            EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
            TO_EMAIL: ${{ secrets.TO_EMAIL }}
